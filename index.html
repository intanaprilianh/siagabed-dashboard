<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SiagaBed · Dasbor nurse station</title>
<meta name="description" content="SiagaBed: dasbor nurse station untuk pemantauan napas tanpa kontak. Antrean tindakan dan denah bed per kamar.">
<link rel="stylesheet" href="vendor/inter/inter.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script>
/* Tema dan tampilan dipasang sebelum halaman digambar: ?tema=gelap|terang, ?ringan, atau pilihan di menu Tim. */
(function () {
  var q = new URLSearchParams(location.search), r = document.documentElement, t = q.get('tema'), saved = {};
  try { saved = JSON.parse(localStorage.getItem('siagabed.tampilan') || '{}'); } catch (e) {}
  t = t || saved.tema;
  if (t === 'gelap' || t === 'dark') r.dataset.theme = 'dark';
  else if (t === 'terang' || t === 'light') r.dataset.theme = 'light';
  if (q.has('ringan') || saved.ringan) r.dataset.render = 'ringan';
})();
</script>
</head>
<body>
<main class="start" id="start" hidden></main>
<main class="phone-app" id="phone" hidden></main>
<main class="demo" id="demo" hidden></main>
<div class="app" id="app">
  <header class="top glass">
    <div class="logo"><span class="mk glass2"><svg width="24" height="24" viewBox="0 0 30 30" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="27" height="27" rx="8" style="stroke:var(--tx)" stroke-width="2.2"/><rect x="7.5" y="7.5" width="15" height="15" rx="4.5" style="stroke:var(--tx)" stroke-width="2.2"/><rect x="12" y="12" width="6" height="6" rx="2" style="fill:var(--tx)"/></svg></span><span class="t">SiagaBed</span></div>
    <div class="ward"><b>Bangsal Melati</b> · Lantai 3</div>
    <nav class="nav glass2" aria-label="Navigasi utama">
      <button type="button" data-view="bangsal">Bangsal</button>
      <button type="button" data-view="log">Log</button>
      <button type="button" data-view="bantuan">Bantuan</button>
      <button type="button" data-view="tim">Tim</button>
    </nav>
    <div class="sp"></div>
    <span class="pill glass2" id="p-nurse"><b>Ns. Rina</b> · jaga</span>
    <button type="button" class="pill glass2" id="p-sound" aria-pressed="false"></button>
    <span class="pill glass2" id="p-src"></span>
    <span class="pill glass2" id="p-terp"></span>
    <span class="clock" id="clock" aria-label="Jam">--.--</span>
  </header>
  <div class="gstrip" id="gstrip" role="alert" hidden></div>
  <section class="detail" id="detail" aria-label="Detail bed" hidden></section>
  <section class="page" id="logpage" aria-label="Log kejadian" hidden></section>
  <section class="page" id="rulespage" aria-label="Aturan alarm" hidden></section>
  <section class="page" id="hubpage" aria-label="Kontrol hub" hidden></section>

  <main class="wrap" id="wrap">
    <section class="left" aria-labelledby="q-title">
      <div class="hd"><h1 id="q-title">Perlu tindakan sekarang</h1><span id="q-sum"></span></div>
      <div class="queue" id="queue"></div>
      <div class="foot glass" id="foot" hidden></div>
    </section>

    <section class="panel glass" id="ward" aria-labelledby="w-title">
      <div class="rhd"><h2 id="w-title">Denah Lantai 3</h2><div class="cnt"><b id="w-terp">–</b>bed terpantau</div></div>
      <div class="lgd" id="tally" aria-label="Jumlah bed per status"></div>
      <div id="rooms"></div>
      <div class="corr"><span>Koridor</span><span class="pill glass2"><b>Nurse station</b></span></div>
    </section>

    <section class="fsheet glass" id="sheet" aria-label="Lembar tindak lanjut" hidden></section>
    <section class="tim glass" id="tim" aria-label="Menu tim" hidden></section>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<div class="sr" id="announce" aria-live="assertive"></div>

<script src="js/engine.js"></script>
<script src="js/serial.js"></script>
<script src="live.js"></script>
<script src="js/app.js"></script>
</body>
</html>
